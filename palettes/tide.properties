# blueshoretide — the blue, light member of the Blueshore family.
# A palette is a skin.properties fragment: SkinName + every token whose
# value differs from src/blueshore/skin.properties. This one lists ALL the
# design tokens so it can be copied as a template for a new variant.

SkinName		= blueshoretide

AccentC			= #2f63e0
AccentHov		= #2a58c9
AccentAct		= #2450b4
AccentTextC		= #2f63e0
AccentLightC	= #e8effc
AccentTintC		= #9db9f2
SurfaceC		= #ffffff
BorderC			= #ecebe7
BtnBorderC		= #dcdad4
RowBorderC		= #f4f3ef
SepLightC		= #f1f0ec
TextMidC		= #4a5058
TextFaintC		= #686e77
TextHeadC		= #6d747e
HoverC			= #f3f2ee
FlagC			= #e0533a
# text and glyphs on accent background (in dark variants this is NOT SurfaceC)
OnAccentC		= #ffffff
# primary button shadow (accent at 30%)
AccentShadowC	= rgba(47,99,224,0.3)
# hover colour of section headers and list rows
HeaderHoverC	= #efeee9
ListHoverC		= #f6f5f1
# state glyphs: unset flag, "read" dot, PDF icon
FlagOffC		= #c3c7cd
ReadDotC		= #d4d7db
PdfC			= #c0533a
# tag/zimlet palette (shared by all variants)
TagBlueC		= #3b6fd4
TagCyanC		= #2f8fc4
TagGrayC		= #9aa0a8
TagGreenC		= #3f9d63
TagOrangeC		= #d98a1f
TagPinkC		= #d4699e
TagPurpleC		= #7b46c7
TagRedC			= #c7563f
TagYellowC		= #d5a018
# background of the expanded thread in conversation view (a barely visible accent tint)
ConvExpandedC	= #f5f8fd
TopbarC			= #ffffff
ReadPaneC		= #ffffff
MsgBodyBgC		= #ffffff
MsgBodyTextC	= #191c20
MsgCard			= padding:10px;
PreviewCard		= 
PreviewCardBox	= 
ColorScheme		= light

# base surfaces / text (legacy harmony names used by the core css)
AppC			=	#fbfbf9
SelC			=	#eaf1fd
SelAltC			= #fafcfe
TxtC			=	#191c20

# legacy core tokens that the dark variants also override: app-tab colour
# (RGB triplet), app-row colour (RGB triplet + hex) and popup shadow
AppTabColorRGB	= 236,235,231
SkinAppRowColorRGB	= 255,255,255
SkinAppRowColorHex	= FFFFFF
PopupShadow		= @cssShadow@:0px 6px 24px rgba(25,28,32,0.12);
