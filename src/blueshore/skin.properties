##########################################################################
#  blueshore — a quiet, light skin for the Zimbra Classic UI
#  Derived from the "harmony" skin shipped with Zimbra FOSS.
#  Modified August 2026 by Gianluca Zamagni, Parvati Srl: changes described
#  in NOTICE.md. This file remains under the GNU GPL version 2 (see above).
#------------------------------------------------------------------------#
#
#  NOTE: Substitutions that begin and end with "_" (eg: "AppC")
#  should only be used within this file -- never in a CSS or HTML file
#
#========================================================================#


SkinName		= blueshore
SkinVersion   	= 1


##########################################################################
#                           Logo Licensing Rules 	   		 	         #
#------------------------------------------------------------------------#
#
#  If you are using the Zimbra Collaboration Suite (ZCS) under the
#  open source license, and you have not modifed the software,
#  then you are required to use the Zimbra logo (the default).
#
	LogoImgDir		= @AppContextPath@/skins/_base/logos
	LogoURL			= #
#
#  Monochrome banner like every stock skin: black on the light top bar,
#  the dark palettes switch it to AppBanner_white.png.
#
	AppBannerImg	= @LogoImgDir@/AppBanner_black.png?v=@jsVersion@
#
#  To brand per-domain without touching this skin, use the
#  zimbraSkinLogoURL / zimbraSkinLogoLoginBanner domain attributes.
#
#========================================================================#

##########################################################################
#                        blueshore design tokens                         #
#------------------------------------------------------------------------#
#
AccentC			= #2f63e0
AccentHov		= #2a58c9
AccentAct		= #2450b4
# accent used as TEXT/stroke on light surfaces (links, active tab, selected
# item, counters, selected icons): in the amber (sand) variants it is darker
# than the fill accent, for legibility
AccentTextC		= @AccentC@
AccentLightC	= #e8effc
AccentTintC		= #9db9f2
SurfaceC		= #ffffff
BorderC			= #ecebe7
BtnBorderC		= #dcdad4
RowBorderC		= #f4f3ef
SepLightC		= #f1f0ec
TextMidC		= #4a5058
TextFaintC		= #686e77
TextHeadC		= #6d747e
HoverC			= #f3f2ee
FlagC			= #e0533a
# text and glyphs on accent background (in dark variants this is NOT SurfaceC)
OnAccentC		= #ffffff
# primary button shadow (accent at 30%)
AccentShadowC	= rgba(47,99,224,0.3)
# hover colour of section headers and list rows
HeaderHoverC	= #efeee9
ListHoverC		= #f6f5f1
# state glyphs: unset flag, "read" dot, PDF icon
FlagOffC		= #c3c7cd
ReadDotC		= #d4d7db
PdfC			= #c0533a
# tag/zimlet palette (shared by all variants)
TagBlueC		= #3b6fd4
TagCyanC		= #2f8fc4
TagGrayC		= #9aa0a8
TagGreenC		= #3f9d63
TagOrangeC		= #d98a1f
TagPinkC		= #d4699e
TagPurpleC		= #7b46c7
TagRedC			= #c7563f
TagYellowC		= #d5a018
# background of the expanded thread in conversation view (a barely visible accent tint)
ConvExpandedC	= #f5f8fd
# surfaces that depart from white in dark variants: top band with app tabs,
# reading pane (capsule header), and the message body "card"
# (background + text + box: in dark it is white on a dark ground, with margin and radius)
TopbarC			= @SurfaceC@
ReadPaneC		= @SurfaceC@
MsgBodyBgC		= @SurfaceC@
MsgBodyTextC	= @TxtC@
MsgCard			= padding:10px;
# Briefcase preview: same card; the box (margin/radius) only in dark variants
PreviewCard		= 
PreviewCardBox	= 
# colour scheme of native browser controls (checkbox, select, scrollbar):
# light | dark — dark palettes set it to dark
ColorScheme		= light
#
#========================================================================#

##########################################################################
#                               Skin Colors                              #
#------------------------------------------------------------------------#
#
	AppC			=	#fbfbf9
	AltC			=	@AccentC@
	SelC			=	#eaf1fd
	# selection in a list WITHOUT focus (base: lighten(SelC,75), a light grey on a dark SelC)
	SelAltC			=	#fafcfe
	SelAltColor		=	@SelAltC@
	TxtC			=	#191c20
#
#========================================================================#


#####################
#	Fonts (Public Sans is bundled in fonts/, see skin.css @font-face)
#####################

FontFamily-classic			= font-family:"Public Sans","Segoe UI",Arial,sans-serif;
FontFamily-modern			= font-family:"Public Sans","Segoe UI",Arial,sans-serif;
FontFamily-system			= font-family:"Public Sans","Segoe UI",Arial,sans-serif;
FontFamily-wide				= font-family:"Public Sans","Segoe UI",Arial,sans-serif;
FontFamily-default			= font-family:"Public Sans","Segoe UI",Arial,sans-serif;

# Root of the type scale: the app puts .user_font_size_<pref> on <html>
# and every rem measure resolves against this generated rule. Design
# choice: 12.5px UI body with the "normal" pref (Zimbra default: 12px).
UserFontSize-normal			= 12.5px;

#####################
#	Derived surfaces (dark-safe): the base uses lighten(AppC,..), which on a
#	dark AppC yields light greys (mini calendar, tooltips)
#####################

AppBg						= background-color:@AppC@;
MiniCalDOWBg				= background-color:transparent; @BottomSeparator@
MiniCalDOWText				= color:@TextFaintC@; text-align:center;
TooltipContainer			= background-color:@SurfaceC@; color:@TxtC@; padding:6px; @BigRoundCorners@ @PopupShadow@ border:1px solid @BorderC@;

#####################
#	Text
#####################

Text-link					= color:@AccentTextC@;
# selected rows in TD-based lists (signatures, contacts...): base = color:black
Text-selected				= color:@TxtC@;
Text-light					= color:@TextFaintC@;
Label-light					= @Label@ color:@TextMidC@;
Text-today					= color:@AccentTextC@;
LinkButtonArrowColor		= @AccentTextC@

#####################
#	Login page
#####################

LoginBannerImg				= @LogoImgDir@/LoginBanner.png?v=@jsVersion@
LoginLabelColor				= white
LoginContentBox				= background-color:@AltC@; padding:10px 0px 40px; @roundCorners(8px)@
LoginButton					= @ButtonRounding@ @ButtonShadowDefault@ border:1px solid @ButtonBorderColor@;
LoginAppName 				= color:white; display:none;

VeilColor					= background-color: black

#####################
#	Top row / app tabs
#####################

SkinSearchRadius 			= 8px
SkinSearchToolbar			= background-color:@HoverC@; @roundCorners(SkinSearchRadius)@
SkinTopRowGradTop			= @TopbarC@
SkinTopRowGradBottom 		= @TopbarC@
SkinTopRowColor				= @TxtC@
SkinTopRowDividerColor		= @BorderC@
SkinTextUsername			= @Text@ font-weight:600;

SkinAppRowColorRGB			= 255,255,255
SkinAppRowColorHex			= FFFFFF
SkinAppRowBorderColorIE		= border-color:transparent;

AppTabColor					= @TopbarC@
AppTabColorRGB				= 236,235,231
AppTabRoundCorners			= @roundCorners(0px)@
AppTabBorder-normal 		= color:@TextMidC@;
AppTabBorder-selected		= background-color:transparent; color:@AccentC@;
AppTabBorder-hover			= background-color:@HoverC@;
AppTabBorder-active			= background-color:@SepLightC@;
AppTabBorder-focused		= background-color:@HoverC@;
AppTabBorder-selected-focused = background-color:transparent;
AppTabText-selected			= font-weight:600;

#####################
#	Headers, panels, separators
#####################

HeaderColor					= @RowBorderC@
HeaderColor-hover			= @HeaderHoverC@
HeaderColor-selected		= @SepLightC@

InputColor					= @TxtC@
InputBgColor				= @SurfaceC@
WidgetBgColor				= @SurfaceC@

PanelColor					= @SurfaceC@
PanelBorderColor			= @BorderC@
PanelBorder					= border:none;

SeparatorColor				= @BorderC@
LightSeparatorColor			= @SepLightC@
DarkSeparatorColor			= @BtnBorderC@

InsetBg						= background-color:@SurfaceC@;

OverviewSection				= background-color:transparent; border-top:none; border-bottom:none;
# compact density: item ~27.5px (stock ~24); was .45rem = 34.8px
TreeItemHeight				= margin:1px 6px; border: @OutlineWidth@ solid transparent; padding:2px 2px; padding:.16rem .2rem;
OverviewZimletSection		= background:none;
TreeHeaderContainer			= background-color: transparent;
TreeHeaderSelectedBg		= background-color: @SelC@;

#####################
#	Buttons
#####################

ButtonRounding				= @roundCorners(7px)@ border-collapse:separate;
ButtonRoundingLeft			= @roundCorners(7px 0px 0px 7px)@
ButtonRoundingRight			= @roundCorners(0px 7px 7px 0px)@

ButtonColorTop				= @SurfaceC@
ButtonColorBottom			= @SurfaceC@
ButtonHovColorTop			= @HoverC@
ButtonHovColorBottom		= @HoverC@
ButtonActColorTop			= @SelC@
ButtonActColorBottom		= @SelC@
ButtonColorDisabled			= @AppC@
ButtonShadowDefault			=
ButtonShadowDisabled		=
ButtonShadowActive			=
ButtonBorderColor			= @BtnBorderC@

ToolbarButtonBorderColor	= transparent
ToolbarNewButtonBorder		= background-color:transparent;
ToolbarContainer			= height:32px; height:2.9rem; padding-top:4px; padding-top:.35rem; @ToolbarBg@
ToolbarButtonHeight			= height:26px; height:2.4rem;

#####################
#	Flatten all legacy 3D borders (inset/outset) to hairlines
#####################

NormalOutsetBorder			= border-color:@BorderC@; @BorderBase@
MediumOutsetBorder			= border-color:@BtnBorderC@; @BorderBase@
DarkOutsetBorder			= border-color:@BtnBorderC@; @BorderBase@
NormalInsetBorder			= border-color:@BorderC@; @BorderBase@
MediumInsetBorder			= border-color:@BorderC@; @BorderBase@
DarkInsetBorder				= border-color:@BtnBorderC@; @BorderBase@
SmallOutsetBorder			= padding:1px; border:1px solid @BorderC@;
SmallInsetBorder			= padding:1px; border:1px solid @BorderC@;

#####################
#	Widget states (menu items, minical buttons): flat, no outset borders
#####################

WidgetBorder-hover			= background-color:@HoverC@;				@TransparentBorder@
WidgetBorder-active			= background-color:@SepLightC@;				@TransparentBorder@
WidgetBorder-selected		= background-color:@SelC@ !important;		@TransparentBorder@
WidgetBorder-focused		= background-color:@HoverC@;				@FocusBorderWithMargin@

#####################
#	Focus / selection
#####################

SelOutsetTopBorderColor		= @AccentTintC@
SelOutsetRightBorderColor	= @AccentTintC@
SelOutsetBottomBorderColor	= @AccentTintC@
SelOutsetLeftBorderColor	= @AccentTintC@

#####################
#	Tabs (dialogs / preferences): same language as app tabs —
#	transparent bar, accent underline on the selected tab
#####################

TabBarColor					= transparent
TabBar						= background-color:transparent; padding-top:2px;
TabColor					= transparent
TabBorderColor				= @BorderC@
TabRoundCorners				= border-collapse:separate; @roundCorners(0px)@
TabBorder					= @TabRoundCorners@ border-style:solid; border-width:1px 1px 2px; text-align:center; white-space:nowrap;
TabBorder-normal			= color:@TextMidC@;					background-color:transparent;	border-color:transparent transparent @BorderC@;
TabBorder-disabled			= @Text-disabled@					background-color:transparent;	border-color:transparent transparent @BorderC@;
TabBorder-hover				= color:@TxtC@;						background-color:@HoverC@;		border-color:transparent transparent @BorderC@;		@ActiveCursor@
TabBorder-active			= color:@AccentC@;					background-color:transparent;	border-color:transparent transparent @AccentC@;		@ActiveCursor@
TabBorder-selected			= color:@AccentC@; font-weight:600;	background-color:transparent;	border-color:transparent transparent @AccentC@;		@ActiveCursor@
TabBarPrefix				= width:10px; border-bottom:2px solid @BorderC@; padding:0px;
TabBarSuffix				= width:100%; border-bottom:2px solid @BorderC@; padding:0px;

#####################
#	Inputs
#####################

InputBorder					= border:1px solid @BtnBorderC@;
InputBorder-disabled		= border:1px solid @BorderC@;
ZFieldBg-focused			= background-color:@SurfaceC@;

#####################
#	Lists
#####################

ListBg						= background-color:transparent;
ListItemBgColor-normal		= @SurfaceC@
ListItemBgColor-alt			= @SurfaceC@
ListItemBgColor-hover		= @ListHoverC@
ListItemBgColor-active		= @SepLightC@

#####################
#	Menus, popups, dialogs
#####################

BigRoundCorners				= @roundCorners(8px)@
PopupShadow					= @cssShadow@:0px 6px 24px rgba(25,28,32,0.12);
PopupWindowBorder			= border:1px solid @BtnBorderC@; padding:6px; @BigRoundCorners@ @PanelBg@ @PopupShadow@

WindowOuterBorder			= background-color:@SurfaceC@;	@PopupShadow@	@roundCorners(8px)@	border:1px solid @BtnBorderC@; margin:0px;
LightWindowOuterBorder		= background-color:@SurfaceC@;	@PopupShadow@	@roundCorners(8px)@	border:1px solid @BorderC@; margin:0px;
WindowInnerBorder			= background-color:@SurfaceC@;	padding:8px 8px 4px;	@roundCorners(0px 0px 8px 8px)@		border-top:1px solid @BorderC@;
LightWindowInnerBorder		= background-color:@SurfaceC@; 	padding:8px 8px 4px;	@roundCorners(0px 0px 8px 8px)@		border-top:1px solid @BorderC@;

ToastRoundCorners			= @roundCorners(7px)@
ToastBackground				= background-color:@AccentLightC@;
ToastText					= color:@TxtC@; margin-top:-1px; padding-left:21px; @FontSize-big@
ToastShadow					= @PopupShadow@

#####################
#	Mail
#####################

MailMsgBorder				= border:1px solid @BorderC@; @roundCorners(8px)@
MailMsgHeaderLight			= background-color:transparent;
MailMsgAttachments			= background-color:@SurfaceC@; border:1px solid @BorderC@; padding:6px 8px; margin:2px 5px; @roundCorners(7px)@
MailConvExpanded			= background-color:@ConvExpandedC@;
MailMsgBody					= background-color:@MsgBodyBgC@;
MailMsgBodyText				= color:@MsgBodyTextC@;
MailMsgBkgdColor			= @MsgBodyBgC@
Conv2Grad1					= @AppC@
Conv2Grad2					= @AppC@

#####################
#	Calendar / mini-cal
#####################

CalendarNowColor			= @AccentC@

#####################
#	Sashes (pane splitters)
#####################

Sash						=
SashContainer				= background-color:@AppC@; height:100%;
SashSize					= 7px
SashPadding					= 0px
VSashContainer				= @RowResizeCursor@ border-top: 1px solid @BorderC@; border-bottom: 1px solid @BorderC@;
HSashContainer				= @ColResizeCursor@ border-left: 1px solid @BorderC@; border-right: 1px solid @BorderC@;

#####################
#	Avatars: rounding at 1/2 of image size makes them circles
#####################

ContactImageRadius					= @roundCorners(24px)@
ContactGroupImageRadius				= @roundCorners(24px)@
MailMsgHeaderImageRadius			= @roundCorners(24px)@
Conv2MsgHeaderImageRadius			= @roundCorners(24px)@
Conv2MsgHeaderCollapsedImageRadius	= @roundCorners(16px)@
